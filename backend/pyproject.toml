[project]
name = "leadgen-agent"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "ARG"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the intended pattern

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005", "E501"]
# Keyword pattern lists read better on one line each
"app/qualify/slots.py" = ["E501"]
"app/agents/comments.py" = ["E501"]
